components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SucessoPadrao:
      type: object
      properties:
        api_description:
          type: string
          example: API para controlar o projeto da Plataforma de Receitas Inteligentes
        development:
          type: string
          example: 4tech
        version:
          type: string
          example: 1.0.10.26
        status:
          type: boolean
          example: true
        status_code:
          type: integer
          example: 200
        message:
          type: string
          example: Ação concluida com sucesso!
        response:
          type: object
          description: Dados retornados pela operação (varia conforme a rota)
    ErroPadrao:
      type: object
      properties:
        status:
          type: boolean
          example: false
        status_code:
          type: integer
          example: 400
        message:
          type: string
          example: Não foi possível processar a requisição devido a erros de entrada
        field:
          type: string
          description: Campo que causou o erro (quando aplicável)
          example: '[EMAIL] INVÁLIDO'
      required:
        - status
        - status_code
        - message
    RegistroRequest:
      type: object
      properties:
        nome:
          type: string
          description: Máximo 150 caracteres
          example: Maria Silva
        username:
          type: string
          description: Máximo 20 caracteres
          example: maria.silva
        email:
          type: string
          example: maria@email.com
        senha:
          type: string
          description: Máximo 15 caracteres
          example: senha123
        data_nascimento:
          type: string
          description: Formato AAAA-MM-DD
          example: '2000-05-10'
        foto_perfil:
          type: string
          description: URL http(s), máximo 2000 caracteres
      required:
        - nome
        - username
        - email
        - senha
        - data_nascimento
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          example: maria@email.com
        senha:
          type: string
          description: Máximo 15 caracteres
          example: senha123
      required:
        - email
        - senha
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          example: maria@email.com
      required:
        - email
    CodigoRequest:
      type: object
      properties:
        codigo:
          type: string
          description: Código de 6 dígitos
          example: '123456'
      required:
        - codigo
    VerificarCodigoResetRequest:
      type: object
      properties:
        email:
          type: string
          example: maria@email.com
        codigo:
          type: string
          description: Código de 6 dígitos
          example: '123456'
      required:
        - email
        - codigo
    RedefinirSenhaRequest:
      type: object
      properties:
        email:
          type: string
          example: maria@email.com
        codigo:
          type: string
          description: Código de recuperação
          example: '123456'
        nova_senha:
          type: string
          description: Máximo 15 caracteres
          example: novaSenha1
      required:
        - email
        - codigo
        - nova_senha
    UsuarioAtualizacao:
      type: object
      properties:
        nome:
          type: string
          description: Máximo 150 caracteres
        username:
          type: string
          description: Máximo 20 caracteres
        descricao:
          type: string
          description: Máximo 200 caracteres
        banner_url:
          type: string
          description: URL http(s), máximo 2000 caracteres
        foto_perfil:
          type: string
          description: URL http(s), máximo 2000 caracteres
      description: Envie apenas os campos que deseja alterar.
    IngredienteReceita:
      type: object
      properties:
        nome:
          type: string
          description: Máximo 35 caracteres. O nome é corrigido pelo catálogo.
          example: ovo
        quantidade:
          type: string
          description: Máximo 10 caracteres
          example: '2'
        id_unidade_medida:
          type: integer
          example: 1
      required:
        - nome
        - quantidade
        - id_unidade_medida
    ModoPreparoItem:
      type: object
      properties:
        metodo_preparo:
          type: string
          description: Máximo 250 caracteres
          example: Bata os ovos
        ordem_preparo:
          type: integer
          example: 1
      required:
        - metodo_preparo
        - ordem_preparo
    CategoriaRef:
      type: object
      properties:
        id:
          type: integer
          example: 1
      required:
        - id
    ComunidadeRef:
      type: object
      properties:
        id:
          type: integer
          example: 1
      required:
        - id
    TagRef:
      type: object
      properties:
        nome_tag:
          type: string
          description: Máximo 30 caracteres
          example: rápido
      required:
        - nome_tag
    ReceitaRequest:
      type: object
      properties:
        titulo:
          type: string
          description: Máximo 50 caracteres
          example: Bolo de cenoura
        descricao:
          type: string
          description: Máximo 200 caracteres
        tempo:
          type: string
          example: 45 min
        foto:
          type: string
          description: URL http(s), máximo 2000 caracteres
        id_porcao:
          type: integer
          example: 1
        id_dificuldade:
          type: integer
          example: 1
        id_custo:
          type: integer
          example: 1
        ingredientes:
          type: array
          items:
            $ref: '#/components/schemas/IngredienteReceita'
        modo_preparo:
          type: array
          items:
            $ref: '#/components/schemas/ModoPreparoItem'
        categoria:
          type: array
          items:
            $ref: '#/components/schemas/CategoriaRef'
        comunidade:
          type: array
          description: Opcional
          items:
            $ref: '#/components/schemas/ComunidadeRef'
        tags:
          type: array
          description: Opcional. Tags inexistentes são criadas automaticamente.
          items:
            $ref: '#/components/schemas/TagRef'
      required:
        - titulo
        - descricao
        - tempo
        - foto
        - id_porcao
        - id_dificuldade
        - id_custo
        - ingredientes
        - modo_preparo
        - categoria
    SugestaoRequest:
      type: object
      properties:
        pesquisa_usuario:
          type: string
          description: Máximo 200 caracteres
          example: frango com batata
      required:
        - pesquisa_usuario
    ComentarioRequest:
      type: object
      properties:
        comentario:
          type: string
          example: Ficou delicioso!
      required:
        - comentario
    GeladeiraRequest:
      type: object
      properties:
        nome_ingrediente:
          type: string
          description: Máximo 35 caracteres
          example: tomate
      required:
        - nome_ingrediente
      description: Informe apenas nome_ingrediente. O id_usuario é obtido pelo token JWT e não deve ser enviado no 
        corpo.
    ComunidadeRequest:
      type: object
      properties:
        nome:
          type: string
          example: Amantes de massas
        descricao:
          type: string
          example: Comunidade para receitas de massas
        foto_url:
          type: string
          description: URL http(s)
        banner_url:
          type: string
          description: URL http(s)
        id_categoria_principal:
          type: integer
          example: 1
      required:
        - nome
        - descricao
        - foto_url
        - banner_url
        - id_categoria_principal
    DenunciaRequest:
      type: object
      properties:
        motivo:
          type: string
          description: Máximo 50 caracteres
          example: Conteúdo impróprio
        detalhe:
          type: string
          description: Máximo 200 caracteres
      required:
        - motivo
    DenunciaGeralRequest:
      type: object
      properties:
        motivo:
          type: string
          description: Máximo 50 caracteres
          example: Conteúdo impróprio
        detalhe:
          type: string
          description: Máximo 200 caracteres
        id_usuario:
          type: integer
          description: Lido do corpo nesta versão da API
          example: 1
      required:
        - motivo
        - id_usuario
    DenunciaUsuarioRelacaoRequest:
      type: object
      properties:
        id_usuario:
          type: integer
          example: 1
        id_denuncia:
          type: integer
          example: 1
      required:
        - id_usuario
        - id_denuncia
    DenunciaComunidadeRelacaoRequest:
      type: object
      properties:
        id_comunidade:
          type: integer
          example: 1
        id_denuncia:
          type: integer
          example: 1
      required:
        - id_comunidade
        - id_denuncia
    ConversaRequest:
      type: object
      properties:
        titulo:
          type: string
          description: Máximo 100 caracteres
          example: Dúvidas sobre massas
        id_usuario:
          type: integer
          description: Lido do corpo nesta versão da API
          example: 1
      required:
        - titulo
        - id_usuario
    MensagemChefinhoRequest:
      type: object
      properties:
        mensagem:
          type: string
          description: Máximo 2000 caracteres
          example: Como fazer um bolo sem glúten?
      required:
        - mensagem
    CategoriaRequest:
      type: object
      properties:
        categoria:
          type: string
          description: Máximo 25 caracteres
          example: Sobremesas
      required:
        - categoria
    TagRequest:
      type: object
      properties:
        nome_tag:
          type: string
          description: Máximo 30 caracteres
          example: vegano
      required:
        - nome_tag
    EmAltaRequest:
      type: object
      properties:
        pesquisa:
          type: string
          description: Máximo 80 caracteres
          example: bolo de chocolate
      required:
        - pesquisa
    ModoPreparoRequest:
      type: object
      properties:
        id_receita:
          type: integer
          example: 1
        metodo_preparo:
          type: string
          description: Máximo 250 caracteres
          example: Asse por 40 minutos
        ordem_preparo:
          type: integer
          example: 3
      required:
        - id_receita
        - metodo_preparo
        - ordem_preparo
    MensagemRequest:
      type: object
      properties:
        conteudo:
          type: string
          example: Olá, Chefinho!
        data:
          type: string
          description: Formato AAAA-MM-DD
          example: '2026-11-23'
        tipo_remetente:
          type: string
          example: usuario
        id_chefinho_conversa:
          type: integer
          example: 1
      required:
        - conteudo
        - data
        - tipo_remetente
        - id_chefinho_conversa
    ComunidadeUsuarioRequest:
      type: object
      properties:
        id_usuario:
          type: integer
          example: 1
        id_comunidade:
          type: integer
          example: 1
      required:
        - id_usuario
        - id_comunidade
    ComunidadeReceitaRequest:
      type: object
      properties:
        id_receita:
          type: integer
          example: 1
        id_comunidade:
          type: integer
          example: 1
      required:
        - id_receita
        - id_comunidade
    SeguidorRequest:
      type: object
      properties: {}
      description: 'Corpo ainda não definido: a rota está em revisão no código.'
  responses:
    BadRequest:
      description: Dados de entrada inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadrao'
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadrao'
    NotFound:
      description: Nenhum dado encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadrao'
    UnsupportedMediaType:
      description: Content-Type diferente de application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadrao'
    InternalServerError:
      description: Erro interno no servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadrao'
