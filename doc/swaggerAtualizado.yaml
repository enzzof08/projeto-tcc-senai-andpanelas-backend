openapi: 3.0.3
info:
  title: API Plataforma Inteligente de Receitas - Entre Panelas
  description: |-
    API do projeto Entre Panelas, plataforma de receitas inteligentes.

    **Autenticação:** rotas marcadas com cadeado exigem o cabeçalho `Authorization: Bearer <token>`, obtido na rota de login.

    **Formato:** as requisições com corpo devem usar `Content-Type: application/json`.

    **Respostas:** sucessos seguem o formato `status`, `status_code`, `message` e `response`; erros seguem `status`, `status_code`, `message` e, quando aplicável, `field`.

    O chefinho (assistente de IA) fica em `/v1/chefinho/conversas`; as demais rotas ficam em `/v1/entrepanelas`.
  version: 1.0.10.26
  contact:
    name: Entre Panelas
    url: https://github.com/enzzof08/projeto-tcc-senai-andpanelas-backend
  license:
    name: Proprietary
    url: https://github.com/mthenryx/projeto-tcc-senai-4tech-andpanelas
servers:
  - url: /
    description: Servidor da API
tags:
  - name: Autenticação
    description: Cadastro, verificação de e-mail, login e recuperação de senha
  - name: Usuários
    description: Perfis e conteúdo relacionado ao usuário
  - name: Seguidores
    description: Seguir e deixar de seguir usuários
  - name: Receitas
    description: Cadastro, busca e gerenciamento de receitas
  - name: Interações
    description: Curtidas e receitas salvas
  - name: Comentários
    description: Comentários em receitas
  - name: Geladeira
    description: Ingredientes disponíveis na geladeira do usuário
  - name: Lista de Compras
    description: Lista de compras a partir das receitas
  - name: Comunidades
    description: Comunidades, participantes e receitas vinculadas
  - name: Denúncias
    description: Denúncias de usuários, comunidades e receitas
  - name: Chefinho
    description: 'Assistente de IA: conversas e mensagens'
  - name: Catálogos
    description: 'Dados de apoio: dificuldades, custos, porções, categorias, tags, ingredientes e itens em alta'
paths:
  /v1/entrepanelas/auth/registro:
    post:
      tags:
        - Autenticação
      summary: Registrar novo usuário
      description: Cadastra a conta e envia o código de verificação para o e-mail informado. A conta só pode fazer login
        após a verificação.
      security: []
      operationId: postV1EntrepanelasAuthRegistro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Item criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/auth/{idUser}/verificar-email:
    post:
      tags:
        - Autenticação
      summary: Verificar e-mail
      description: Confirma o e-mail com o código de 6 dígitos enviado no cadastro.
      security: []
      operationId: postV1EntrepanelasAuthIduserVerificarEmail
      parameters:
        - name: idUser
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodigoRequest'
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/auth/{idUser}/reenviar-codigo:
    post:
      tags:
        - Autenticação
      summary: Reenviar código de verificação
      description: Reenvia o código de verificação de e-mail. Há intervalo mínimo de 60 segundos entre solicitações.
      security: []
      operationId: postV1EntrepanelasAuthIduserReenviarCodigo
      parameters:
        - name: idUser
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/auth/login:
    post:
      tags:
        - Autenticação
      summary: Login
      description: Autentica com e-mail e senha e retorna o token JWT. Exige e-mail verificado.
      security: []
      operationId: postV1EntrepanelasAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/auth/recuperar-senha:
    post:
      tags:
        - Autenticação
      summary: Solicitar recuperação de senha
      description: Envia um código de recuperação para o e-mail cadastrado.
      security: []
      operationId: postV1EntrepanelasAuthRecuperarSenha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/auth/verificar-codigo-reset:
    post:
      tags:
        - Autenticação
      summary: Verificar código de recuperação
      description: Valida o código de recuperação antes da redefinição de senha.
      security: []
      operationId: postV1EntrepanelasAuthVerificarCodigoReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificarCodigoResetRequest'
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/auth/redefinir-senha:
    post:
      tags:
        - Autenticação
      summary: Redefinir senha
      description: Define a nova senha usando o código de recuperação validado.
      security: []
      operationId: postV1EntrepanelasAuthRedefinirSenha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenhaRequest'
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/usuarios:
    get:
      tags:
        - Usuários
      summary: Listar usuários
      security:
        - bearerAuth: []
      operationId: getV1EntrepanelasUsuarios
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      description: Lista os usuários cadastrados. Exige autenticação por token JWT.
  /v1/entrepanelas/usuarios/busca/username:
    get:
      tags:
        - Usuários
      summary: Buscar usuários por nome de usuário
      security:
        - bearerAuth: []
      operationId: getV1EntrepanelasUsuariosBuscaUsername
      parameters:
        - name: nome
          in: query
          required: true
          description: Termo de busca
          schema:
            type: string
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      description: Busca usuários usando o termo enviado no parâmetro de consulta nome.
  /v1/entrepanelas/usuarios/{idUserPerfil}:
    get:
      tags:
        - Usuários
      summary: Buscar perfil de usuário
      description: Retorna o perfil do usuário identificado por idUserPerfil. O usuário que consulta é identificado pelo
        token JWT.
      security:
        - bearerAuth: []
      operationId: getV1EntrepanelasUsuariosIduserperfil
      parameters:
        - name: idUserPerfil
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/entrepanelas/usuarios/{idUsuario}/receitas:
    get:
      tags:
        - Usuários
      summary: Listar receitas do usuário
      security:
        - bearerAuth: []
      operationId: getV1EntrepanelasUsuariosIdusuarioReceitas
      parameters:
        - name: idUsuario
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      description: Lista as receitas do usuário indicado por idUsuario. A autenticação é feita pelo token JWT.
  /v1/entrepanelas/receitas:
    get:
      tags:
        - Receitas
      summary: Listar receitas
      security:
        - bearerAuth: []
      operationId: getV1EntrepanelasReceitas
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Receitas
      summary: Cadastrar receita
      description: |-
        Cadastra a receita com ingredientes, modo de preparo, categorias, comunidades e tags. Os nomes dos ingredientes são corrigidos pelo catálogo antes de salvar. O usuário responsável é identificado pelo token JWT.
      security:
        - bearerAuth: []
      operationId: postV1EntrepanelasReceitas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceitaRequest'
      responses:
        '201':
          description: Item criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/receitas/populares/semana:
    get:
      tags:
        - Receitas
      summary: Receitas mais curtidas da semana
      security: []
      operationId: getV1EntrepanelasReceitasPopularesSemana
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/receitas/busca/nome:
    get:
      tags:
        - Receitas
      summary: Buscar receitas por nome
      security:
        - bearerAuth: []
      operationId: getV1EntrepanelasReceitasBuscaNome
      parameters:
        - name: nome
          in: query
          required: true
          description: Termo de busca
          schema:
            type: string
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/receitas/busca/sugestao:
    post:
      tags:
        - Receitas
      summary: Sugerir receitas com IA
      description: |-
        Gera sugestões de receitas a partir da pesquisa do usuário.

        **Atenção:** Rota com erro no código: o controlador do Chefinho não está importado em receita.router.js, então a requisição retorna erro 500 até a correção.
      security:
        - bearerAuth: []
      operationId: postV1EntrepanelasReceitasBuscaSugestao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoRequest'
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/receitas/busca/categoria/{idCategoria}:
    get:
      tags:
        - Receitas
      summary: Buscar receitas por categoria
      security:
        - bearerAuth: []
      operationId: getV1EntrepanelasReceitasBuscaCategoriaIdcategoria
      parameters:
        - name: idCategoria
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/receitas/ingrediente/buscar:
    get:
      tags:
        - Receitas
      summary: Buscar receitas pelos ingredientes
      description: Retorna receitas que utilizam os ingredientes informados.
      security:
        - bearerAuth: []
      operationId: getV1EntrepanelasReceitasIngredienteBuscar
      parameters:
        - name: ingredientes
          in: query
          required: true
          description: 'Lista de ingredientes. Ex.: ?ingredientes=ovo&ingredientes=farinha'
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/receitas/{id}:
    get:
      tags:
        - Receitas
      summary: Buscar receita por ID
      security:
        - bearerAuth: []
      operationId: getV1EntrepanelasReceitasId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Receitas
      summary: Atualizar receita
      description: Envia a receita completa, no mesmo formato do cadastro.
      security:
        - bearerAuth: []
      operationId: putV1EntrepanelasReceitasId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceitaRequest'
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Receitas
      summary: Excluir receita
      description: '**Atenção:** Rota com erro no código: usa a variável request_usuario, que não existe. Retorna erro 500
        até a correção.'
      security:
        - bearerAuth: []
      operationId: deleteV1EntrepanelasReceitasId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/receitas/{idReceita}/curtir:
    post:
      tags:
        - Interações
      summary: Curtir receita
      security:
        - bearerAuth: []
      operationId: postV1EntrepanelasReceitasIdreceitaCurtir
      parameters:
        - name: idReceita
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Item criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Interações
      summary: Remover curtida
      security:
        - bearerAuth: []
      operationId: deleteV1EntrepanelasReceitasIdreceitaCurtir
      parameters:
        - name: idReceita
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/receitas/{idReceita}/salvar:
    post:
      tags:
        - Interações
      summary: Salvar receita
      security:
        - bearerAuth: []
      operationId: postV1EntrepanelasReceitasIdreceitaSalvar
      parameters:
        - name: idReceita
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Item criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Interações
      summary: Remover receita salva
      description: O usuário é identificado pelo token JWT; somente idReceita é informado na URL.
      security:
        - bearerAuth: []
      operationId: deleteV1EntrepanelasReceitasIdreceitaSalvar
      parameters:
        - name: idReceita
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/receitas/{idReceita}/comentarios:
    get:
      tags:
        - Comentários
      summary: Listar comentários da receita
      security: []
      operationId: getV1EntrepanelasReceitasIdreceitaComentarios
      parameters:
        - name: idReceita
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Comentários
      summary: Comentar receita
      security:
        - bearerAuth: []
      operationId: postV1EntrepanelasReceitasIdreceitaComentarios
      parameters:
        - name: idReceita
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComentarioRequest'
      responses:
        '201':
          description: Item criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/entrepanelas/receitas/comentarios/{idComentario}:
    put:
      tags:
        - Comentários
      summary: Editar comentário
      security:
        - bearerAuth: []
      operationId: putV1EntrepanelasReceitasComentariosIdcomentario
      parameters:
        - name: idComentario
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComentarioRequest'
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucessoPadrao'
        '400':
