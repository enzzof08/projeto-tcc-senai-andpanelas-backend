                  - 2
                  - 3
                  example: 1
                id_dificuldade:
                  type: integer
                  enum:
                  - 1
                  - 2
                  - 3
                  example: 1
                id_porcao:
                  type: integer
                  minimum: 1
                  maximum: 15
                  example: 4
                modo_preparo:
                  type: array
                  description: 'Lista completa de passos após a atualização. Envie [] para remover todos. Em cada item, o
                    id é opcional: com id, atualiza; sem id, cria. A ordem é definida por ordem_preparo.'
                  items:
                    $ref: '#/components/schemas/ModoPreparoRequest'
                  example:
                  - id: 4
                    metodo_preparo: Aqueça a frigideira em fogo alto e sele os filés.
                    ordem_preparo: 1
                  - metodo_preparo: Adicione os temperos e cozinhe até finalizar.
                    ordem_preparo: 2
                ingredientes:
                  type: array
                  description: 'Lista completa de ingredientes após a atualização. Envie [] para remover todos. Em cada item,
                    o id é opcional: com id, atualiza; sem id, cria.'
                  items:
                    $ref: '#/components/schemas/IngredienteRequest'
                  example:
                  - id: 10
                    nome: Filé de frango
                    quantidade: '700'
                    id_unidade_medida: 1
                  - nome: Limão siciliano
                    quantidade: '3'
                    id_unidade_medida: 5
              required:
              - ingredientes
              - modo_preparo
              - titulo
              - descricao
              - foto
              - tempo
              - id_custo
              - id_dificuldade
              - id_porcao
            example:
              titulo: Frango ao Limão Siciliano
              descricao: Frango marinado com limão siciliano e ervas.
              foto: https://exemplo.com/frango.jpg
              video: https://exemplo.com/frango.mp4
              tempo: 00:40:00
              id_custo: 1
              id_dificuldade: 1
              id_porcao: 4
              modo_preparo:
              - id: 4
                metodo_preparo: Aqueça a frigideira em fogo alto e sele os filés.
                ordem_preparo: 1
              - metodo_preparo: Adicione os temperos e cozinhe até finalizar.
                ordem_preparo: 2
              ingredientes:
              - id: 10
