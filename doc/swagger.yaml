                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 500
                message: O servidor encontrou uma falha interna no controller ou model responsável pela operação "Listar
                  ingredientes da lista por receita". A solicitação não pôde ser concluída.
