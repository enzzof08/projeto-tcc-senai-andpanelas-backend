                  usuários". A solicitação não pôde ser concluída.
  /usuarios/busca/username:
    get:
      tags:
      - Usuários
      summary: Buscar usuários por username semelhante
      description: Recebe um username parcial ou completo e retorna usuários com usernames semelhantes, junto com suas 
        informações públicas de perfil.
      parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 20
          example: ana
        description: Trecho ou username que será utilizado para localizar correspondências.
      responses:
        '200':
          description: Usuários encontrados com sucesso.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    count:
                      type: integer
                      minimum: 0
                    response:
                      type: object
                      properties:
                        dados:
                          type: array
                          items:
                            $ref: '#/components/schemas/UsuarioPerfil'
                  required:
                  - count
                  - response
              example:
                api_description: API para controlar o projeto da Plataforma de Receita Inteligentes
                development: ''
                version: 1.0.10.26
                status: true
                status_code: 200
                count: 2
                response:
                  dados:
                  - id: 1
                    nome: Ana Costa
                    username: anacosta
                    descricao: Chef caseira apaixonada por comida brasileira.
                    banner_url: https://exemplo.com/banner.jpg
                    foto_perfil: https://exemplo.com/ana.jpg
                    data_nascimento: '2009-01-20'
                    qtd_seguidores: 1200
                    qtd_seguindo: 389
                    qtd_receitas: 47
                  - id: 2
                    nome: Ana Carolina
