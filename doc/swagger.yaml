  /usuarios:
    get:
      tags:
      - Usuários
      summary: Listar usuários
      description: Retorna uma lista paginada de usuários da plataforma. Este endpoint é público.
      parameters:
      - name: pagina
        in: query
        schema:
          type: integer
          default: 1
        description: Número da página
      - name: limite
        in: query
        schema:
          type: integer
          default: 20
        description: Quantidade de registros por página
      - name: busca
        in: query
        schema:
          type: string
        description: Buscar por nome ou username
      responses:
        '200':
          description: Lista de usuários retornada com sucesso
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    response:
                      type: object
                      properties:
                        dados:
                          type: array
                          items:
                            $ref: '#/components/schemas/UsuarioPerfil'
                        total:
                          type: integer
                        pagina:
                          type: integer
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
