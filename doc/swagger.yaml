                  id: 1
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 400
                message: Os dados enviados não estão em um formato válido para esta operação.
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 401
                message: Acesso não autorizado porque o usuário não está autenticado ou o token de acesso não foi 
                  informado.
        "500":
          description: Erro interno do servidor
          content:
