      description: 'Atualiza uma receita. Apenas o autor da receita pode atualizá-la. O payload deve representar a estrutura
        completa dos ingredientes e do modo de preparo que a receita deve possuir após a atualização. O backend sincroniza
        tbl_ingrediente e tbl_modo_preparo: itens com id existente são atualizados, itens sem id são criados e itens existentes
        que não estiverem nas listas enviadas são removidos.'
