openapi: 3.0.0

info:
  title: API Plataforma Inteligente de Receitas - Entre Panelas
  description: API para controlar o projeto da Plataforma de Receita Inteligentes
  version: 1.0.10.26
  contact:
    name: Entre Panelas
    url: https://github.com/enzzof08/projeto-tcc-senai-andpanelas-backend/tree/main
  license:
    name: Proprietary
    url: https://github.com/mthenryx/projeto-tcc-senai-4tech-andpanelas

servers:
  - url: /v1/entrepanelas
    description: Entre Panelas API v1

tags:
  - name: Autenticação
    description: Rotas de login, registro e recuperação de conta
  - name: Usuários
    description: CRUD e operações relacionadas a perfis de usuário
  - name: Receitas
    description: CRUD de receitas e operações relacionadas
  - name: Ingredientes
    description: Ingredientes das receitas
  - name: Geladeira
    description: Ingredientes disponíveis na geladeira do usuário
  - name: Lista de Compras
    description: Gerenciamento de lista de compras
  - name: Comunidades
    description: Operações com comunidades
  - name: Interações
    description: Curtidas e comentários em receitas
  - name: Chefinho
    description: Conversa com assistente IA
  - name: Denúncias
    description: Sistema de denúncias com análise por IA
  - name: Seguindo
    description: Operações de seguir/seguidores

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # RESPONSE ENVELOPE
    ApiResponse:
      type: object
      properties:
        api_description:
          type: string
          default: "API para controlar o projeto da Plataforma de Receita Inteligentes"
        development:
          type: string
          description: "Nome do desenvolvedor responsável (vazio na documentação inicial)"
          default: ""
        version:
          type: string
          default: "1.0.10.26"
        status:
          type: boolean
        status_code:
          type: integer
          enum: [200, 201, 400, 401, 404, 415, 500, 502]
        response:
          type: object
      required:
        - api_description
        - development
        - version
        - status
        - status_code
        - response

    ErrorResponse:
      type: object
      properties:
        status:
          type: boolean
          enum:
            - false
        status_code:
          type: integer
          enum:
            - 400
            - 401
            - 404
            - 415
            - 500
            - 502
        message:
          type: string
      required:
        - status
        - status_code
        - message
      example:
        status: false
        status_code: 500
        message: O servidor encontrou uma falha interna ao processar a solicitação.
    Usuario:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nome:
          type: string
          maxLength: 150
        username:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 256
        descricao:
          type: string
          maxLength: 200
        banner_url:
          type: string
          format: uri
          maxLength: 2000
        foto_perfil:
          type: string
          format: uri
          maxLength: 2000
        data_nascimento:
          type: string
          format: date
      required:
        - nome
        - username
        - email
        - descricao
        - banner_url
        - foto_perfil
        - data_nascimento

    UsuarioPerfil:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        username:
          type: string
        descricao:
          type: string
        banner_url:
          type: string
        foto_perfil:
          type: string
        data_nascimento:
          type: string
          format: date
        qtd_seguidores:
          type: integer
        qtd_seguindo:
          type: integer
        qtd_receitas:
          type: integer

    # RECEITA
    Receita:
      type: object
      properties:
        id:
          type: integer
          format: int32
        titulo:
          type: string
          maxLength: 50
        descricao:
          type: string
          maxLength: 200
        foto:
          type: string
          format: uri
          maxLength: 2048
        video:
          type: string
          format: uri
          maxLength: 2083
        tempo:
          type: string
          format: time
          description: "Tempo de preparo no formato HH:MM:SS"
        qtd_curtida:
          type: integer
          minimum: 0
        id_custo:
          type: integer
          enum: [1, 2, 3]
          description: "1=Econômico, 2=Moderado, 3=Alto"
        id_dificuldade:
          type: integer
          enum: [1, 2, 3]
          description: "1=Fácil, 2=Médio, 3=Difícil"
        id_porcao:
          type: integer
          minimum: 1
          maximum: 15
        id_usuario:
          type: integer
        usuario:
          $ref: '#/components/schemas/UsuarioSimplificado'
      required:
        - titulo
        - descricao
        - foto
        - tempo
        - id_custo
        - id_dificuldade
        - id_porcao
        - id_usuario

    ReceitaCompleta:
      allOf:
        - $ref: '#/components/schemas/Receita'
        - type: object
          properties:
            ingredientes:
              type: array
              items:
                $ref: '#/components/schemas/Ingrediente'
            modo_preparo:
              type: array
              items:
                $ref: '#/components/schemas/ModoPreparo'
            categorias:
              type: array
              items:
                type: string
            tags:
              type: array
              items:
                type: string
            comentarios:
              type: array
              items:
                $ref: '#/components/schemas/Comentario'
            eh_curtida_pelo_usuario:
              type: boolean
            eh_salva_pelo_usuario:
              type: boolean

    UsuarioSimplificado:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        username:
          type: string
        foto_perfil:
          type: string

    # INGREDIENTE
    Ingrediente:
      type: object
      description: "Ingrediente de uma receita com quantidade e unidade de medida"
      properties:
        id:
          type: integer
          format: int32
          example: 1
          description: "ID único do ingrediente"
        nome:
          type: string
          maxLength: 35
          example: "Frango"
          description: "Nome do ingrediente"
        quantidade:
          type: string
          maxLength: 10
          example: "500"
          description: "Quantidade do ingrediente"
        id_receita:
          type: integer
          example: 1
          description: "ID da receita a qual o ingrediente pertence"
        id_unidade_medida:
          type: integer
          enum: [1, 2, 3, 4, 5]
          example: 1
          description: "ID da unidade de medida (1=g, 2=kg, 3=ml, 4=L, 5=un)"
        unidade_medida:
          type: string
          example: "g"
          enum: ["g", "kg", "ml", "L", "un"]
          description: "Nome da unidade de medida"
      required:
        - nome
        - quantidade
        - id_unidade_medida
        - id_receita
      example:
        id: 1
        nome: "Frango"
        quantidade: "500"
        id_receita: 1
        id_unidade_medida: 1
        unidade_medida: "g"

    IngredienteRequest:
      type: object
      description: "Dados para adicionar um ingrediente a uma receita"
      properties:
        nome:
          type: string
          maxLength: 35
          example: "Frango"
        quantidade:
          type: string
          maxLength: 10
          example: "600"
        id_unidade_medida:
          type: integer
          enum: [1, 2, 3, 4, 5]
          example: 1
          description: "ID da unidade de medida (1=g, 2=kg, 3=ml, 4=L, 5=un)"
      required:
        - nome
        - quantidade
        - id_unidade_medida
      example:
        nome: "Frango"
        quantidade: "600"
        id_unidade_medida: 1

    IngredienteUpdateRequest:
      type: object
      description: "Dados para atualizar um ingrediente de uma receita"
      properties:
        nome:
          type: string
          maxLength: 35
          example: "Frango"
        quantidade:
          type: string
          maxLength: 10
          example: "600"
        id_unidade_medida:
          type: integer
          enum: [1, 2, 3, 4, 5]
          example: 1
          description: "ID da unidade de medida (1=g, 2=kg, 3=ml, 4=L, 5=un)"
      example:
        nome: "Frango"
        quantidade: "600"
        id_unidade_medida: 1

    # MODO PREPARO
    ModoPreparo:
      type: object
      properties:
        id:
          type: integer
        metodo_preparo:
          type: string
          maxLength: 250
        ordem_preparo:
          type: integer
          minimum: 1

    # CATEGORIA
    Categoria:
      type: object
      properties:
        id:
          type: integer
        categoria:
          type: string
          enum:
            - "Café da manhã"
            - "Almoço"
            - "Jantar"
            - "Sobremesa"
            - "Lanche"
            - "Sopa"
            - "Salada"
            - "Bebida"

    # TAG
    Tag:
      type: object
      properties:
        id:
          type: integer
        nome_tag:
          type: string
          maxLength: 30

    # COMENTARIO
    Comentario:
      type: object
      properties:
        id:
          type: integer
        comentario:
          type: string
          maxLength: 250
        id_receita:
          type: integer
        id_usuario:
          type: integer
        usuario:
          $ref: '#/components/schemas/UsuarioSimplificado'

    # GELADEIRA
    IngredienteGeladeira:
      type: object
      properties:
        id:
          type: integer
        nome_ingrediente:
          type: string
          maxLength: 35
        quantidade:
          type: integer
          minimum: 1
        id_unidade_medida:
          type: integer
          description: "1=g, 2=kg, 3=ml, 4=L, 5=un"
        unidade_medida:
          type: string

    # LISTA DE COMPRAS
    ItemListaCompra:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        quantidade:
          type: string
        id_unidade_medida:
          type: integer
        id_status:
          type: integer
          enum: [1, 2]
          description: "1=comprado, 2=pendente"
        status:
          type: string
          enum: ["comprado", "pendente"]

    # COMUNIDADE
    Comunidade:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          maxLength: 80
        descricao:
          type: string
          maxLength: 300
        foto_url:
          type: string
          format: uri
          maxLength: 2000
        banner_url:
          type: string
          format: uri
          maxLength: 2000
        id_categoria_principal:
          type: integer
          description: "Categoria principal da comunidade"
        categoria_principal:
          type: string
        qtd_membros:
          type: integer
      required:
        - nome
        - descricao
        - foto_url
        - banner_url
        - id_categoria_principal

    CategoriaComunidade:
      type: object
      properties:
        id:
          type: integer
        categoria_principal:
          type: string
          enum:
            - "Confeitaria & Doces"
            - "Culinária Brasileira"
            - "Vegano & Vegetariano"
            - "Fitness & Saudável"
            - "Massas & Risotos"
            - "Bebidas & Drinks"
            - "Churrasco"

    # CHEFINHO
    ChefinhoConversa:
      type: object
      properties:
        id:
          type: integer
        titulo:
          type: string
          maxLength: 100
        data_hora:
          type: string
          format: date-time
        id_usuario:
          type: integer

    Mensagem:
      type: object
      properties:
        id:
          type: integer
        conteudo:
          type: string
          maxLength: 3000
        tipo_remetente:
          type: string
          enum: ["usuario", "chefinho"]
        data_hora:
          type: string
          format: date-time
        id_chefinho_conversa:
          type: integer

    # DENUNCIA
    Denuncia:
      type: object
      properties:
        id:
          type: integer
        motivo:
          type: string
          maxLength: 50
        detalhe:
          type: string
          maxLength: 200
        data_hora:
          type: string
          format: date-time
        id_usuario:
          type: integer
        id_receita:
          type: integer
        id_comunidade:
          type: integer
        id_usuario_denunciado:
          type: integer

    # AUTENTICACAO
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
      required:
        - email
        - senha

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: "Token JWT para autenticação"
        usuario:
          $ref: '#/components/schemas/UsuarioPerfil'

    RegistroRequest:
      type: object
      properties:
        nome:
          type: string
          maxLength: 150
        username:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
        senha:
          type: string
        data_nascimento:
          type: string
          format: date
        foto_perfil:
          type: string
          format: uri
      required:
        - nome
        - username
        - email
        - senha
        - data_nascimento

    VerificacaoEmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        codigo:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'
      required:
        - email
        - codigo

    RecuperacaoSenhaRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    NovasenhaRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        codigo:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'
        nova_senha:
          type: string
        confirmar_senha:
          type: string
      required:
        - email
        - codigo
        - nova_senha
        - confirmar_senha

    ConfirmarAlteracaoRequest:
      type: object
      properties:
        codigo:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'
      required:
        - codigo

paths:
  # ============ AUTENTICAÇÃO ============

  /auth/registro:
    post:
      tags:
        - Autenticação
      summary: Registrar novo usuário
      description: Cria uma nova conta na plataforma. Um código de 6 dígitos será enviado para o e-mail para 
        verificação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
            example:
              nome: "Carlos Ferreira"
              username: "carlosf"
              email: "carlos@email.com"
              senha: "senha123"
              data_nascimento: "1990-05-15"
              foto_perfil: "https://exemplo.com/foto.jpg"
      responses:
        "201":
          description: Usuário registrado com sucesso. Código de verificação enviado para o e-mail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                api_description: "API para controlar o projeto da Plataforma de Receita Inteligentes"
                development: ""
                version: "1.0.10.26"
                status: true
                status_code: 201
                response:
                  message: "Usuário registrado com sucesso. Código de verificação enviado para carlosferreira@email.com"
        "400":
          description: Dados inválidos ou e-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 400
                message: Os dados enviados são inválidos ou o e-mail informado já está cadastrado.
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 500
                message: O servidor encontrou uma falha interna no controller ou model responsável pela operação 
                  "Registrar novo usuário". A solicitação não pôde ser concluída.
  /auth/verificar-email:
    post:
      tags:
        - Autenticação
      summary: Verificar código de confirmação de e-mail
      description: Valida o código de 6 dígitos enviado ao e-mail durante o cadastro do usuário. Este é o FLUXO 1 de 
        verificação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificacaoEmailRequest'
            example:
              email: "carlos@email.com"
              codigo: "123456"
      responses:
        "200":
          description: E-mail verificado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                api_description: "API para controlar o projeto da Plataforma de Receita Inteligentes"
                development: ""
                version: "1.0.10.26"
                status: true
                status_code: 200
                response:
                  message: "E-mail verificado com sucesso"
        "400":
          description: Código inválido, expirado ou já utilizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 400
                message: O código informado é inválido, expirou ou já foi utilizado.
        "404":
          description: Usuário ou e-mail não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 404
                message: O usuário ou o e-mail informado não foi encontrado.
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 500
                message: O servidor encontrou uma falha interna no controller ou model responsável pela operação 
                  "Verificar código de confirmação de e-mail". A solicitação não pôde ser concluída.
  /auth/login:
    post:
      tags:
        - Autenticação
      summary: Autenticar usuário
      description: Realiza o login do usuário na plataforma. Retorna um token JWT para autenticação em rotas protegidas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "carlos@email.com"
              senha: "senha123"
      responses:
        "200":
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      response:
                        $ref: '#/components/schemas/LoginResponse'
              example:
                api_description: "API para controlar o projeto da Plataforma de Receita Inteligentes"
                development: ""
                version: "1.0.10.26"
                status: true
                status_code: 200
                response:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  usuario:
                    id: 1
                    nome: "Carlos Ferreira"
                    username: "carlosf"
                    email: "carlos@email.com"
        "401":
          description: E-mail ou senha inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 401
                message: As credenciais informadas são inválidas; o e-mail ou a senha não correspondem a uma conta 
                  válida.
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 404
                message: O usuário informado não foi encontrado.
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 500
                message: O servidor encontrou uma falha interna no controller ou model responsável pela operação 
                  "Autenticar usuário". A solicitação não pôde ser concluída.
  /auth/recuperar-senha:
    post:
      tags:
        - Autenticação
      summary: Solicitar recuperação de senha
      description: Inicia o fluxo de recuperação de senha. Um código de 6 dígitos será enviado para o e-mail. Este é o 
        FLUXO 2 de verificação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperacaoSenhaRequest'
            example:
              email: "carlos@email.com"
      responses:
        "200":
          description: Código de recuperação enviado para o e-mail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                api_description: "API para controlar o projeto da Plataforma de Receita Inteligentes"
                development: ""
                version: "1.0.10.26"
                status: true
                status_code: 200
                response:
                  message: "Código de recuperação enviado para carlos@email.com"
        "404":
          description: Usuário ou e-mail não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 404
                message: O usuário ou o e-mail informado não foi encontrado.
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 500
                message: O servidor encontrou uma falha interna no controller ou model responsável pela operação 
                  "Solicitar recuperação de senha". A solicitação não pôde ser concluída.
  /auth/verificar-codigo-reset:
    post:
      tags:
        - Autenticação
      summary: Verificar código de recuperação de senha
      description: Valida o código de 6 dígitos enviado para recuperação de senha. Parte do FLUXO 2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificacaoEmailRequest'
            example:
              email: "carlos@email.com"
              codigo: "654321"
      responses:
        "200":
          description: Código válido. Usuário pode prosseguir para redefinição da senha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                api_description: "API para controlar o projeto da Plataforma de Receita Inteligentes"
                development: ""
                version: "1.0.10.26"
                status: true
                status_code: 200
                response:
                  message: "Código válido. Prossiga para redefinir a senha."
        "400":
          description: Código inválido, expirado ou já utilizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 400
                message: O código informado é inválido, expirou ou já foi utilizado.
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 404
                message: O usuário informado não foi encontrado.
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 500
                message: O servidor encontrou uma falha interna no controller ou model responsável pela operação 
