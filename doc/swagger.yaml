          description: Receita criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                api_description: "API para controlar o projeto da Plataforma de Receita Inteligentes"
                development: ""
                version: "1.0.10.26"
                status: true
                status_code: 201
                response:
