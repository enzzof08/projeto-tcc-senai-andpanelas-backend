      description: Inicia o fluxo para alterar a senha. Um código de 6 dígitos será enviado para o e-mail cadastrado 
        (FLUXO 3).
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                senha_atual:
                  type: string
              required:
              - senha_atual
            example:
              senha_atual: senhaAtual123
      responses:
        '200':
          description: Código de confirmação enviado para o e-mail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Senha atual incorreta ou não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 401
                message: 'Acesso não autorizado: a senha atual está incorreta ou o usuário não está autenticado.'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 500
                message: O servidor encontrou uma falha interna no controller ou model responsável pela operação 
                  "Solicitar alteração de senha". A solicitação não pôde ser concluída.
  /receitas:
    get:
      tags:
      - Receitas
      summary: Listar receitas
      description: Retorna uma lista paginada de receitas. Suporta filtros por categoria, dificuldade, custo, tempo de 
        preparo e busca por texto.
      parameters:
      - name: pagina
        in: query
        schema:
          type: integer
          default: 1
      - name: limite
        in: query
        schema:
          type: integer
          default: 20
      - name: busca
        in: query
        schema:
          type: string
        description: Buscar por título ou descrição da receita
      - name: id_categoria
        in: query
        schema:
          type: integer
        description: Filtrar por categoria
      - name: id_dificuldade
        in: query
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
          description: 1=Fácil, 2=Médio, 3=Difícil
      - name: id_custo
        in: query
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
          description: 1=Econômico, 2=Moderado, 3=Alto
      - name: tempo_max
        in: query
        schema:
          type: string
        description: Tempo máximo de preparo (HH:MM:SS)
      - name: id_comunidade
        in: query
        schema:
          type: integer
        description: Filtrar por receitas de uma comunidade
      - name: ordenar_por
        in: query
        schema:
          type: string
          enum:
          - recente
          - populares
          - curtidas
        description: Ordenação das receitas
      responses:
        '200':
          description: Lista de receitas retornada com sucesso
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    response:
                      type: object
                      properties:
                        dados:
                          type: array
                          items:
                            $ref: '#/components/schemas/Receita'
                        total:
                          type: integer
                        pagina:
                          type: integer
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 500
                message: O servidor encontrou uma falha interna no controller ou model responsável pela operação "Listar
                  receitas". A solicitação não pôde ser concluída.
    post:
      tags:
      - Receitas
      summary: Criar uma nova receita
      description: Cria uma nova receita. Os ingredientes e o modo de preparo fazem parte do mesmo payload da receita. O
        backend é responsável por persistir esses dados nas tabelas relacionadas (tbl_ingrediente e tbl_modo_preparo), 
        além de categorias e tags.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo:
                  type: string
                  maxLength: 50
                descricao:
                  type: string
                  maxLength: 200
                foto:
                  type: string
                  format: uri
                video:
                  type: string
                  format: uri
                tempo:
                  type: string
                  format: time
                id_custo:
                  type: integer
                  enum:
                  - 1
                  - 2
                  - 3
                id_dificuldade:
                  type: integer
                  enum:
                  - 1
                  - 2
                  - 3
                id_porcao:
                  type: integer
                  minimum: 1
                  maximum: 15
                ingredientes:
                  type: array
                  description: Lista completa de ingredientes da receita. O backend grava cada item em tbl_ingrediente e
                    associa tudo à receita.
                  items:
                    $ref: '#/components/schemas/IngredienteRequest'
                  example:
                  - nome: Frango
                    quantidade: '500'
                    id_unidade_medida: 1
                  - nome: Cebola
                    quantidade: '1'
                    id_unidade_medida: 5
                  - nome: Azeite
                    quantidade: '50'
                    id_unidade_medida: 3
                modo_preparo:
                  type: array
                  items:
                    $ref: '#/components/schemas/ModoPreparoRequest'
                  description: Lista completa e ordenada dos passos da receita. O backend grava cada item em 
                    tbl_modo_preparo e associa tudo à receita.
                categorias:
                  type: array
                  items:
                    type: integer
                  description: IDs das categorias selecionadas para a receita.
                tags:
                  type: array
                  items:
                    type: integer
                  description: IDs das tags selecionadas para a receita.
              required:
              - titulo
              - descricao
              - foto
              - tempo
              - id_custo
              - id_dificuldade
              - id_porcao
              - ingredientes
              - modo_preparo
            example:
              titulo: Frango ao Limão Siciliano
              descricao: Frango marinado com limão siciliano e ervas.
              foto: https://exemplo.com/frango.jpg
              video: https://exemplo.com/frango.mp4
              tempo: 00:40:00
              id_custo: 1
              id_dificuldade: 1
              id_porcao: 4
              ingredientes:
              - nome: Filé de frango
                quantidade: '600'
                id_unidade_medida: 1
              - nome: Limão siciliano
                quantidade: '3'
                id_unidade_medida: 5
              modo_preparo:
              - metodo_preparo: Aqueça uma frigideira e sele os filés.
                ordem_preparo: 1
              - metodo_preparo: Adicione os temperos e cozinhe até finalizar.
                ordem_preparo: 2
              categorias:
              - 2
              tags:
              - 3
              - 4
      responses:
        '201':
          description: Receita criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                api_description: API para controlar o projeto da Plataforma de Receita Inteligentes
                development: ''
                version: 1.0.10.26
                status: true
                status_code: 201
                response:
                  message: Receita criada com sucesso
                  id: 1
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 400
                message: Os dados enviados não estão em um formato válido para esta operação.
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 401
                message: Acesso não autorizado porque o usuário não está autenticado ou o token de acesso não foi 
                  informado.
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 500
                message: O servidor encontrou uma falha interna no controller ou model responsável pela operação "Criar 
                  uma nova receita". A solicitação não pôde ser concluída.
