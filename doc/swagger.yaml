                    descricao: Receitas rápidas e caseiras.
                    banner_url: https://exemplo.com/banner2.jpg
                    foto_perfil: https://exemplo.com/ana2.jpg
                    data_nascimento: '2005-06-10'
                    qtd_seguidores: 320
                    qtd_seguindo: 150
                    qtd_receitas: 18
        '400':
          description: Username de busca inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
