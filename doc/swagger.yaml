          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 401
                message: 'Acesso não autorizado: o usuário não está autenticado ou não possui permissão para atualizar este
                  recurso.'
        '404':
          description: Receita não encontrada
          content:
            application/json:
