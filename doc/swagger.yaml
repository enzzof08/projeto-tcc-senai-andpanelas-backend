  /usuarios/me/lista-compras/receita/{id_receita}:
    get:
      tags:
      - Lista de Compras
      summary: Listar ingredientes da lista de compras por receita
      description: 'Retorna os ingredientes de uma receita específica que foram

        adicionados à lista de compras do usuário autenticado.


        O resultado pode ser filtrado pelo status da compra,

        permitindo visualizar todos os ingredientes, somente os

        pendentes ou somente os ingredientes já comprados.


        O usuário é identificado através do token JWT.'
      security:
      - bearerAuth: []
      parameters:
      - name: id_receita
        in: path
        required: true
        schema:
          type: integer
        description: ID da receita
        example: 5
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Todos
          - Pendentes
          - Comprados
          default: Todos
        description: 'Filtro utilizado para definir quais ingredientes da

          lista de compras serão retornados.


          Todos retorna todos os ingredientes da receita.

          Pendentes retorna somente os ingredientes pendentes.

          Comprados retorna somente os ingredientes já comprados.'
        example: Pendentes
      responses:
        '200':
          description: Ingredientes da receita obtidos com sucesso
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    response:
                      type: object
                      properties:
                        dados:
                          type: array
                          items:
                            $ref: '#/components/schemas/ItemListaCompra'
        '400':
          description: ID da receita ou filtro de status inválido
          content:
            application/json:
              schema:
