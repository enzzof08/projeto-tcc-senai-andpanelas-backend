openapi: 3.0.0
info:
  title: API Plataforma Inteligente de Receitas - Entre Panelas
  description: API para controlar o projeto da Plataforma de Receita Inteligentes
  version: 1.0.10.26
  contact:
    name: Entre Panelas
    url: https://github.com/enzzof08/projeto-tcc-senai-andpanelas-backend/tree/main
  license:
    name: Proprietary
    url: https://github.com/mthenryx/projeto-tcc-senai-4tech-andpanelas
servers:
- url: /v1/entrepanelas
  description: Entre Panelas API v1
tags:
- name: Autenticação
  description: Rotas de login, registro e recuperação de conta
- name: Usuários
  description: CRUD e operações relacionadas a perfis de usuário
- name: Receitas
  description: CRUD de receitas e operações relacionadas
- name: Geladeira
  description: Ingredientes disponíveis na geladeira do usuário
- name: Lista de Compras
  description: Gerenciamento de lista de compras
- name: Comunidades
  description: Operações com comunidades
- name: Interações
  description: Curtidas, comentários e receitas salvas
- name: Chefinho
  description: Conversa com assistente IA
- name: Seguindo
  description: Operações de seguir/seguidores
- name: Denúncias
  description: Criação de denúncias de perfis, comunidades e receitas
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        api_description:
          type: string
          default: API para controlar o projeto da Plataforma de Receita Inteligentes
        development:
          type: string
          description: Nome do desenvolvedor responsável (vazio na documentação inicial)
          default: ''
        version:
          type: string
          default: 1.0.10.26
        status:
          type: boolean
        status_code:
          type: integer
          enum:
          - 200
          - 201
        response:
          type: object
      required:
      - api_description
      - development
      - version
      - status
      - status_code
      - response
    ErrorResponse:
      type: object
      properties:
        status:
          type: boolean
          enum:
          - false
        status_code:
          type: integer
          enum:
          - 400
          - 401
          - 404
          - 415
          - 500
          - 502
        message:
          type: string
      required:
      - status
      - status_code
      - message
      example:
        status: false
        status_code: 500
        message: O servidor encontrou uma falha interna ao processar a solicitação.
    Usuario:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nome:
          type: string
          maxLength: 150
        username:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 256
        descricao:
          type: string
          maxLength: 200
        banner_url:
          type: string
          format: uri
          maxLength: 2000
        foto_perfil:
          type: string
          format: uri
          maxLength: 2000
        data_nascimento:
          type: string
          format: date
      required:
      - nome
      - username
      - email
      - descricao
      - banner_url
      - foto_perfil
      - data_nascimento
    UsuarioPerfil:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        username:
          type: string
        descricao:
          type: string
        banner_url:
          type: string
        foto_perfil:
          type: string
        data_nascimento:
          type: string
          format: date
        qtd_seguidores:
          type: integer
        qtd_seguindo:
          type: integer
        qtd_receitas:
          type: integer
    Receita:
      type: object
      properties:
        id:
          type: integer
          format: int32
        titulo:
          type: string
          maxLength: 50
        descricao:
          type: string
          maxLength: 200
        foto:
          type: string
          format: uri
          maxLength: 2048
        video:
          type: string
          format: uri
          maxLength: 2083
        tempo:
          type: string
          format: time
          description: Tempo de preparo no formato HH:MM:SS
        qtd_curtida:
          type: integer
          minimum: 0
        id_custo:
          type: integer
          enum:
          - 1
          - 2
          - 3
          description: 1=Econômico, 2=Moderado, 3=Alto
        id_dificuldade:
          type: integer
          enum:
          - 1
          - 2
          - 3
          description: 1=Fácil, 2=Médio, 3=Difícil
        id_porcao:
          type: integer
          minimum: 1
          maximum: 15
        id_usuario:
          type: integer
        usuario:
          $ref: '#/components/schemas/UsuarioSimplificado'
      required:
      - titulo
      - descricao
      - foto
      - tempo
      - id_custo
      - id_dificuldade
      - id_porcao
      - id_usuario
    ReceitaCompleta:
      allOf:
      - $ref: '#/components/schemas/Receita'
      - type: object
        properties:
          ingredientes:
            type: array
            items:
              $ref: '#/components/schemas/Ingrediente'
          modo_preparo:
            type: array
            items:
              $ref: '#/components/schemas/ModoPreparo'
          categorias:
            type: array
            items:
              type: string
          tags:
            type: array
            items:
              type: string
          comentarios:
            type: array
            items:
              $ref: '#/components/schemas/Comentario'
          eh_curtida_pelo_usuario:
            type: boolean
          eh_salva_pelo_usuario:
            type: boolean
          qtd_curtidas:
            type: integer
            minimum: 0
            description: Quantidade total de curtidas recebidas pela receita.
            example: 342
    UsuarioSimplificado:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        username:
          type: string
        foto_perfil:
          type: string
    Ingrediente:
      type: object
      description: Ingrediente de uma receita com quantidade e unidade de medida
      properties:
        id:
          type: integer
          format: int32
          example: 1
          description: ID único do ingrediente
        nome:
          type: string
          maxLength: 35
          example: Frango
          description: Nome do ingrediente
        quantidade:
          type: string
          maxLength: 10
          example: '500'
          description: Quantidade do ingrediente
        id_receita:
          type: integer
          example: 1
          description: ID da receita a qual o ingrediente pertence
        id_unidade_medida:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          example: 1
          description: ID da unidade de medida (1=g, 2=kg, 3=ml, 4=L, 5=un)
        unidade_medida:
          type: string
          example: g
          enum:
          - g
          - kg
          - ml
          - L
          - un
          description: Nome da unidade de medida
      required:
      - nome
      - quantidade
      - id_unidade_medida
      - id_receita
      example:
        id: 1
        nome: Frango
        quantidade: '500'
        id_receita: 1
        id_unidade_medida: 1
        unidade_medida: g
    IngredienteRequest:
      type: object
      description: Dados de um ingrediente dentro da receita. No POST /receitas, o id não deve ser enviado. No PUT 
        /receitas/{id}, o id pode ser enviado para identificar um ingrediente já existente; itens sem id representam 
        novos ingredientes e ingredientes existentes que não forem enviados na lista completa devem ser removidos pelo 
        backend.
      properties:
        nome:
          type: string
          maxLength: 35
          example: Frango
        quantidade:
          type: string
          maxLength: 10
          example: '600'
        id_unidade_medida:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          example: 1
          description: ID da unidade de medida (1=g, 2=kg, 3=ml, 4=L, 5=un)
        id:
          type: integer
          format: int32
          example: 10
          description: ID do ingrediente já existente. Usado apenas na atualização da receita.
      required:
      - nome
      - quantidade
      - id_unidade_medida
      example:
        nome: Filé de frango
        quantidade: '600'
        id_unidade_medida: 1
    ModoPreparo:
      type: object
      description: Passo do modo de preparo de uma receita.
      properties:
        id:
          type: integer
          format: int32
          example: 1
        metodo_preparo:
          type: string
          maxLength: 250
          example: Aqueça uma frigideira em fogo alto e sele os filés.
        ordem_preparo:
          type: integer
          minimum: 1
          example: 1
        id_receita:
          type: integer
          example: 1
          description: ID da receita à qual o passo pertence.
      required:
      - metodo_preparo
      - ordem_preparo
      - id_receita
    Categoria:
      type: object
      properties:
        id:
          type: integer
        categoria:
          type: string
          maxLength: 25
          description: Nome da categoria. O backend verifica se ela já existe antes de cadastrar.
    Tag:
      type: object
      properties:
        id:
          type: integer
        nome_tag:
          type: string
          maxLength: 30
    Comentario:
      type: object
      properties:
        id:
          type: integer
        comentario:
          type: string
          maxLength: 250
        id_receita:
          type: integer
        id_usuario:
          type: integer
        usuario:
          $ref: '#/components/schemas/UsuarioSimplificado'
    IngredienteGeladeira:
      type: object
      properties:
        id:
          type: integer
        nome_ingrediente:
          type: string
          maxLength: 35
        quantidade:
          type: integer
          minimum: 1
        id_unidade_medida:
          type: integer
          description: 1=g, 2=kg, 3=ml, 4=L, 5=un
        unidade_medida:
          type: string
    ReceitaListaCompra:
      type: object
      properties:
        id:
          type: integer
          description: ID da receita
          example: 5
        titulo:
          type: string
          description: Nome da receita
          example: Macarrão ao molho
        foto:
          type: string
          format: uri
          description: Imagem da receita
          example: https://exemplo.com/macarrao.jpg
    ItemListaCompra:
      type: object
      properties:
        id:
          type: integer
          description: ID do item da lista de compras
          example: 7
        nome:
          type: string
          description: Nome do ingrediente
          example: Tomate
        quantidade:
          type: string
          description: Quantidade do ingrediente
          example: 2 unidades
        id_unidade_medida:
          type: integer
          description: ID da unidade de medida utilizada pelo ingrediente
          example: 5
        id_status:
          type: integer
          enum:
          - 1
          - 2
          description: 1=Comprado, 2=Pendente
          example: 2
        status:
          type: string
          enum:
          - comprado
          - pendente
          description: Status atual do ingrediente na lista de compras
          example: pendente
    Comunidade:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          maxLength: 80
        descricao:
          type: string
          maxLength: 300
        foto_url:
          type: string
          format: uri
          maxLength: 2000
        banner_url:
          type: string
          format: uri
          maxLength: 2000
        id_categoria_principal:
          type: integer
          description: Categoria principal da comunidade
        categoria_principal:
          type: string
        qtd_membros:
          type: integer
      required:
      - nome
      - descricao
      - foto_url
      - banner_url
      - id_categoria_principal
    CategoriaComunidade:
      type: object
      properties:
        id:
          type: integer
        categoria_principal:
          type: string
          enum:
          - Confeitaria & Doces
          - Culinária Brasileira
          - Vegano & Vegetariano
          - Fitness & Saudável
          - Massas & Risotos
          - Bebidas & Drinks
          - Churrasco
    ChefinhoConversa:
      type: object
      properties:
        id:
          type: integer
        titulo:
          type: string
          maxLength: 100
        data_hora:
          type: string
          format: date-time
        id_usuario:
          type: integer
    Mensagem:
      type: object
      properties:
        id:
          type: integer
        conteudo:
          type: string
          maxLength: 3000
        tipo_remetente:
          type: string
          enum:
          - usuario
          - chefinho
        data_hora:
          type: string
          format: date-time
        id_chefinho_conversa:
          type: integer
    Denuncia:
      type: object
      properties:
        id:
          type: integer
        motivo:
          type: string
          maxLength: 50
        detalhe:
          type: string
          maxLength: 200
        data_hora:
          type: string
          format: date-time
        id_usuario:
          type: integer
        id_receita:
          type: integer
        id_comunidade:
          type: integer
        id_usuario_denunciado:
          type: integer
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
      required:
      - email
      - senha
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT para autenticação
        usuario:
          $ref: '#/components/schemas/UsuarioPerfil'
    RegistroRequest:
      type: object
      properties:
        nome:
          type: string
          maxLength: 150
        username:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
        senha:
          type: string
        data_nascimento:
          type: string
          format: date
        foto_perfil:
          type: string
          format: uri
      required:
      - nome
      - username
      - email
      - senha
      - data_nascimento
    VerificacaoEmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        codigo:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
      required:
      - email
      - codigo
    RecuperacaoSenhaRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    NovasenhaRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        codigo:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
        nova_senha:
          type: string
        confirmar_senha:
          type: string
      required:
      - email
      - codigo
      - nova_senha
      - confirmar_senha
    ConfirmarAlteracaoRequest:
      type: object
      properties:
        codigo:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
      required:
      - codigo
    ModoPreparoRequest:
      type: object
      description: Dados de um passo do modo de preparo dentro da receita. No POST /receitas, o id não deve ser enviado.
        No PUT /receitas/{id}, o id pode ser enviado para identificar um passo já existente; itens sem id representam 
        novos passos e passos existentes que não forem enviados na lista completa devem ser removidos pelo backend.
      properties:
        metodo_preparo:
          type: string
          maxLength: 250
          example: Aqueça uma frigideira em fogo alto e sele os filés.
        ordem_preparo:
          type: integer
          minimum: 1
          example: 1
        id:
          type: integer
          format: int32
          example: 4
          description: ID do passo já existente. Usado apenas na atualização da receita.
      required:
      - metodo_preparo
      - ordem_preparo
      example:
        metodo_preparo: Aqueça uma frigideira em fogo alto e sele os filés.
        ordem_preparo: 1
    EmAltaItem:
      type: object
      description: Termo ou nome de receita armazenado em tbl_em_alta, com a quantidade de ocorrências agrupadas.
      properties:
        nome:
          type: string
          maxLength: 80
          description: Valor da coluna pesquisa, apresentado pelo front-end como nome/termo em alta.
          example: Frango ao Limão Siciliano
        quantidade_pesquisas:
          type: integer
          minimum: 1
          description: Quantidade de registros encontrados para este valor de pesquisa no período consultado.
          example: 128
        data_dia:
          type: string
          format: date
          example: '2026-09-30'
      required:
      - nome
      - quantidade_pesquisas
      - data_dia
    ReceitasSemana:
      type: object
      description: Receitas destacadas na seção Receita da semana, nas posições Top 1, Top 2 e Top 3.
      properties:
        top_1:
          $ref: '#/components/schemas/ReceitaCompleta'
        top_2:
          $ref: '#/components/schemas/ReceitaCompleta'
        top_3:
          $ref: '#/components/schemas/ReceitaCompleta'
      required:
      - top_1
      - top_2
      - top_3
    IngredienteBuscaRequest:
      type: object
      description: Ingrediente informado pelo usuário na busca tradicional por ingredientes.
      properties:
        nome:
          type: string
          maxLength: 35
          example: Frango
        quantidade:
          type: string
          maxLength: 10
          example: '600'
        id_unidade_medida:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          description: 1=g, 2=kg, 3=ml, 4=L, 5=un
          example: 1
      required:
      - nome
      - quantidade
      - id_unidade_medida
    BuscaIngredientesResultado:
      type: object
      properties:
        receita:
          $ref: '#/components/schemas/ReceitaCompleta'
        compatibilidade_percentual:
          type: number
          minimum: 0
          maximum: 100
          example: 80
      required:
      - receita
      - compatibilidade_percentual
    ReceitaSugestaoIA:
      type: object
      description: Receita completa sugerida pelo Chefinho quando a base da plataforma não possui uma opção adequada. 
        Não possui ID de banco até ser cadastrada.
      properties:
        titulo:
          type: string
          maxLength: 50
          example: Frango com Cacau e Limão
        descricao:
          type: string
          maxLength: 200
          example: Frango grelhado com molho de cacau e limão.
        foto:
          type: string
          format: uri
          example: https://exemplo.com/frango-cacau.jpg
        video:
          type: string
          format: uri
          nullable: true
          example: https://exemplo.com/frango-cacau.mp4
        tempo:
          type: string
          format: time
          example: 00:40:00
        id_custo:
          type: integer
          enum:
          - 1
          - 2
          - 3
          example: 1
        id_dificuldade:
          type: integer
          enum:
          - 1
          - 2
          - 3
          example: 1
        id_porcao:
          type: integer
          minimum: 1
          maximum: 15
          example: 4
        ingredientes:
          type: array
          items:
            $ref: '#/components/schemas/IngredienteRequest'
        modo_preparo:
          type: array
          items:
            $ref: '#/components/schemas/ModoPreparoRequest'
        categorias:
          type: array
          items:
            type: string
          example:
          - Almoço
        tags:
          type: array
          items:
            type: string
          example:
          - Proteica
          - Saudavel
        origem:
          type: string
          enum:
          - chefinho_ia
          example: chefinho_ia
        na_base:
          type: boolean
          enum:
          - false
          example: false
      required:
      - titulo
      - descricao
      - foto
      - tempo
      - id_custo
      - id_dificuldade
      - id_porcao
      - ingredientes
      - modo_preparo
      - origem
      - na_base
    DenunciaUsuarioRequest:
      type: object
      description: Dados obrigatórios para denunciar um perfil de usuário.
      properties:
        id_usuario:
          type: integer
          description: ID do usuário que realizou a denúncia.
          example: 10
        id_usuario_denunciado:
          type: integer
          description: ID do usuário que está sendo denunciado.
          example: 25
        motivo:
          type: string
          maxLength: 50
          enum:
          - Conteúdo impróprio ou ofensivo
          - Spam ou propaganda
          - Não tem relação com culinária
          - Violação de direitos autorais
          - Outro motivo
          example: Spam ou propaganda
        detalhe:
          type: string
          maxLength: 200
          description: Explicação complementar do motivo da denúncia.
          example: O perfil publica repetidamente conteúdo promocional sem relação com a plataforma.
      required:
      - id_usuario
      - id_usuario_denunciado
      - motivo
      - detalhe
    DenunciaComunidadeRequest:
      type: object
      description: Dados obrigatórios para denunciar uma comunidade.
      properties:
        id_usuario:
          type: integer
          description: ID do usuário que realizou a denúncia.
          example: 10
        id_comunidade:
          type: integer
          description: ID da comunidade denunciada.
          example: 3
        motivo:
          type: string
          maxLength: 50
          enum:
          - Conteúdo impróprio ou ofensivo
          - Spam ou propaganda
          - Não tem relação com culinária
          - Violação de direitos autorais
          - Outro motivo
          example: Não tem relação com culinária
        detalhe:
          type: string
          maxLength: 200
          description: Explicação complementar do motivo da denúncia.
          example: A comunidade está sendo utilizada para publicar conteúdo não relacionado à culinária.
      required:
      - id_usuario
      - id_comunidade
      - motivo
      - detalhe
    DenunciaReceitaRequest:
      type: object
      description: Dados obrigatórios para denunciar uma receita.
      properties:
        id_usuario:
          type: integer
          description: ID do usuário que realizou a denúncia.
          example: 10
        id_receita:
          type: integer
          description: ID da receita denunciada.
          example: 42
        motivo:
          type: string
          maxLength: 50
          enum:
          - Conteúdo impróprio ou ofensivo
          - Spam ou propaganda
          - Não tem relação com culinária
          - Violação de direitos autorais
          - Outro motivo
          example: Violação de direitos autorais
        detalhe:
          type: string
          maxLength: 200
          description: Explicação complementar do motivo da denúncia.
          example: A publicação utiliza conteúdo de terceiros sem indicação de autoria.
      required:
      - id_usuario
      - id_receita
      - motivo
      - detalhe
    CategoriaRequest:
      type: object
      description: Dados para inserir uma categoria. O backend verifica se o nome já existe; se existir, não cria 
        duplicata e retorna OK. Se não existir, cadastra no banco e retorna OK.
      properties:
        categoria:
          type: string
          maxLength: 25
          example: Massas
          description: Nome da nova categoria.
      required:
      - categoria
      example:
        categoria: Massas
    CategoriaPrincipalRequest:
      type: object
      description: Dados para inserir uma nova categoria principal utilizada na classificação das comunidades. O backend verifica se a categoria principal já existe; se existir, não cria duplicata e retorna OK. Se não existir, cadastra a nova categoria principal em tbl_categoria_principal e retorna OK do mesmo modo.
      properties:
        categoria_principal:
          type: string
          maxLength: 50
          example: Culinária Nordestina
          description: Nome da nova categoria principal da comunidade.
      required:
      - categoria_principal
      example:
        categoria_principal: Culinária Nordestina
    TagRequest:
      type: object
      description: Dados para inserir uma tag. O backend verifica se o nome já existe; se existir, não cria duplicata e 
        retorna OK. Se não existir, cadastra no banco e retorna OK.
      properties:
        nome_tag:
          type: string
          maxLength: 30
          example: SemLactose
          description: Nome da tag utilizada na classificação das receitas.
      required:
      - nome_tag
      example:
        nome_tag: SemLactose
paths:
  /auth/registro:
    post:
      tags:
      - Autenticação
      summary: Registrar novo usuário
      description: Cria uma nova conta na plataforma. Um código de 6 dígitos será enviado para o e-mail para 
        verificação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
            example:
              nome: Carlos Ferreira
              username: carlosf
              email: carlos@email.com
              senha: senha123
              data_nascimento: '1990-05-15'
              foto_perfil: https://exemplo.com/foto.jpg
      responses:
        '201':
          description: Usuário registrado com sucesso. Código de verificação enviado para o e-mail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                api_description: API para controlar o projeto da Plataforma de Receita Inteligentes
                development: ''
                version: 1.0.10.26
                status: true
                status_code: 201
                response:
                  message: Usuário registrado com sucesso. Código de verificação enviado para carlosferreira@email.com
        '400':
          description: Dados inválidos ou e-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 400
                message: Os dados enviados são inválidos ou o e-mail informado já está cadastrado.
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 500
                message: O servidor encontrou uma falha interna no controller ou model responsável pela operação 
                  "Registrar novo usuário". A solicitação não pôde ser concluída.
  /auth/verificar-email:
