                quantidade: '700'
                id_unidade_medida: 1
              - nome: Limão siciliano
                quantidade: '3'
                id_unidade_medida: 5
      responses:
        '200':
          description: Receita atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
