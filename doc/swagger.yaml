    post:
      tags:
      - Receitas
      summary: Buscar receitas por ingredientes
      description: Recebe um ou mais ingredientes com suas quantidades e unidades de medida. Retorna receitas da base 
        com percentual de compatibilidade e, quando a base não oferece uma opção adequada, sugestões completas geradas 
        pelo Chefinho IA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ingredientes:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/IngredienteBuscaRequest'
                  description: Ingredientes e medidas informados pelo usuário.
              required:
              - ingredientes
            example:
              ingredientes:
              - nome: Frango
                quantidade: '600'
                id_unidade_medida: 1
              - nome: Limão siciliano
                quantidade: '3'
                id_unidade_medida: 5
              - nome: Azeite
                quantidade: '50'
                id_unidade_medida: 3
      responses:
        '200':
          description: Busca por ingredientes realizada com sucesso.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    response:
                      type: object
                      properties:
                        receitas_base:
                          type: array
                          items:
                            $ref: '#/components/schemas/BuscaIngredientesResultado'
                        sugestoes_chefinho:
                          type: array
                          items:
                            $ref: '#/components/schemas/ReceitaSugestaoIA'
        '400':
          description: Ingredientes de busca inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
