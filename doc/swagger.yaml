          in: query
          schema:
            type: integer
          description: Filtrar por categoria
        - name: id_dificuldade
          in: query
          schema:
            type: integer
            enum: [1, 2, 3]
            description: 1=Fácil, 2=Médio, 3=Difícil
        - name: id_custo
          in: query
          schema:
            type: integer
            enum: [1, 2, 3]
            description: 1=Econômico, 2=Moderado, 3=Alto
        - name: tempo_max
          in: query
          schema:
            type: string
          description: Tempo máximo de preparo (HH:MM:SS)
        - name: id_comunidade
          in: query
          schema:
            type: integer
          description: Filtrar por receitas de uma comunidade
        - name: ordenar_por
          in: query
          schema:
            type: string
            enum: ["recente", "populares", "curtidas"]
          description: Ordenação das receitas
      responses:
        "200":
          description: Lista de receitas retornada com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      response:
                        type: object
                        properties:
                          dados:
                            type: array
                            items:
                              $ref: '#/components/schemas/Receita'
                          total:
                            type: integer
                          pagina:
                            type: integer
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: false
                status_code: 500
                message: O servidor encontrou uma falha interna no controller ou model responsável pela operação "Listar
                  receitas". A solicitação não pôde ser concluída.
    post:
      tags:
        - Receitas
      summary: Criar uma nova receita
      description: Cria uma nova receita. Apenas usuários autenticados podem criar receitas.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo:
                  type: string
                  maxLength: 50
                descricao:
                  type: string
                  maxLength: 200
                foto:
                  type: string
                  format: uri
                video:
                  type: string
                  format: uri
                tempo:
                  type: string
                  format: time
                id_custo:
                  type: integer
                  enum: [1, 2, 3]
                id_dificuldade:
                  type: integer
                  enum: [1, 2, 3]
                id_porcao:
                  type: integer
                  minimum: 1
                  maximum: 15
                ingredientes:
                  type: array
                  description: "Lista de ingredientes da receita"
                  items:
                    $ref: '#/components/schemas/Ingrediente'
                  example:
                    - nome: "Frango"
                      quantidade: "500"
                      id_unidade_medida: 1
                    - nome: "Cebola"
                      quantidade: "1"
                      id_unidade_medida: 5
                    - nome: "Azeite"
                      quantidade: "50"
                      id_unidade_medida: 3
                modo_preparo:
                  type: array
                  items:
                    type: object
                    properties:
                      metodo_preparo:
                        type: string
                      ordem_preparo:
                        type: integer
                categorias:
                  type: array
                  items:
                    type: integer
                tags:
                  type: array
                  items:
                    type: integer
              required:
                - titulo
                - descricao
                - foto
                - tempo
                - id_custo
                - id_dificuldade
                - id_porcao
                - ingredientes
                - modo_preparo
      responses:
